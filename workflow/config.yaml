# ---------------------------------------------------------------------------
# BiStro Snakemake pipeline configuration (template).
# Copy this file, fill in your own paths, and pass it to Snakemake with
# --configfile (see main_Snakemake.sh).
# ---------------------------------------------------------------------------

input:
  samples_tsv: "path/to/samples.tsv"    # TSV, no header: <path/to/sample.bam>\t<sample_id>[\t<group>] (group: optional, used by call_cosmic)
  fasta: "path/to/reference.fa.gz"      # reference genome, bgzip-compressed + indexed
  output_directory: "path/to/output/"

bistro_setup: ""         # shell snippet to activate BiStro's environment before each rule, e.g. "conda activate bistro"
bistro_cmd: "python -m bistro"

target_regions: ""       # e.g. "chr1,chr2" -- restrict calling to these contigs
exclude_regions: ""      # e.g. "chrM" -- exclude these contigs

# Passed straight through to `bistro preprocess`. See `bistro preprocess --help`.
call_preprocess:
  low_complexity_regions: ""   # optional: BED of low-complexity regions to mask (e.g. sdust output)
  min_mapq: 60
  min_sequence_identity: .99
  min_bq: 93
  min_qlen: 800
  max_qlen: 10000
  min_depth: 3
  trim_percentage: .05
  indels_window: 10
  mismatch_window_len: 50
  min_ec: 5
  max_softclipping: .2
  z_prob: 1000000
  check_mem_usage: 100000
  collapsed: False          # True: collapsed reads (e.g. standard HiFi), each read is its own molecule

# Passed straight through to `bistro somatic`. See `bistro somatic --help`.
call_somatic:
  threshold: 1              # --thr: how many OTHER samples must show a variant before it stops counting as private
  max_muts_per_duplex: 1
  min_alt_support: 1
  min_mapq: 30
  min_baseq: 70

# Passed straight through to `bistro sbs96`. See `bistro sbs96 --help`.
call_sbs96:
  preset_genome:    # optional, e.g. GRCh38 / GRCm39 -- skips the whole-genome FASTA scan

# Passed straight through to `bistro cosmic`. See `bistro cosmic --help`.
# Groups come from input.samples_tsv's optional 3rd column (none -> one group).
call_cosmic:
  genome: ""                # REQUIRED: SigProfilerAssignment build, one of GRCh37 GRCh38 mm9 mm10 mm39 rn6 rn7
  cosmic_version: 3.6
  column: normcounts        # normcounts.tsv column fitted (normcounts = opportunity-corrected; counts = raw)
  nboot: 1000
  min_samples: 3            # validated if lower 95% CI > 0 in >= this many samples of the group
  merge_groups_tier1: False # True: tier 1 on one pooled pseudo-sample per group (min_samples ignored)
  bootstrap_tier2: False    # True: also bootstrap tier 2 for CIs on the final exposures
  poisson: False
  seed: 12345

custom_resources:
  call_preprocess:
    mem_mb: 44000
    runtime: 360
    threads: 20
    partition: "short"

  call_somatic:
    mem_mb: 120000
    runtime: 360
    threads: 20
    partition: "short"

  call_sbs96:
    mem_mb: 8000
    runtime: 120
    threads: 20
    partition: "short"

  call_cosmic:
    mem_mb: 5000
    runtime: 60
    threads: 8
    partition: "short"
